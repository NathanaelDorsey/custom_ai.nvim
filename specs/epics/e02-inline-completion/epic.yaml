# specs/epics/e02-inline-completion/epic.yaml
# Epic capsule manifest for inline-code-completion

epic_id: "e02"
slug: "inline-completion"
title: "Inline Code Completion (blink.cmp integration)"
core_value: "Local AI code completions powered by llama.cpp models, integrated into blink.cmp with automatic project context"

# WSJF components for ordering in release-plan.yaml
wsjf:
  user_business_value: 8      # High: Copilot-like experience is core value prop
  time_criticality: 5         # Medium: No hard deadline
  risk_reduction: 7           # High: Validates blink.cmp integration, context gathering, async plumbing
  opportunity_enablement: 6   # Medium: Enables future streaming, dedicated models, passive mode
  job_size: 5                 # Medium: ~10 stories, new integration surface

# Story list with BCPs and delta type (ADDED | MODIFIED | REMOVED | RENAMED)
stories:
  - story_id: "e02s01"
    title: "Tracer Bullet: Manual trigger → blink.cmp source → single-line completion"
    bcps: 5
    delta: "ADDED"
    description: "Thin vertical slice: <C-space> in insert mode triggers blink.cmp menu with one AI completion (single-line, minimal context). Proves end-to-end plumbing."
    status: "completed"

  - story_id: "e02s02"
    title: "blink.cmp source registration and config integration"
    bcps: 3
    delta: "ADDED"
    description: "Register custom_ai as a blink.cmp source with proper kind/label, respect global toggle, integrate with custom_ai config system."
    status: "completed"

  - story_id: "e02s03"
    title: "Automatic project context gathering (LSP + treesitter)"
    bcps: 8
    delta: "ADDED"
    description: "Gather imports, type definitions, related functions, test files via vim.lsp (workspace symbols, references, definitions) and vim.treesitter (local AST). Inject into completion prompt."
    status: "pending"

  - story_id: "e02s04"
    title: "Async completion request to llama.cpp with context injection"
    bcps: 5
    delta: "ADDED"
    description: "Non-blocking vim.system() POST to /v1/completions (or /v1/chat/completions) with assembled context. Handle queue, cancellation, timeouts."
    status: "pending"

  - story_id: "e02s05"
    title: "Single-line completion support (next token/line)"
    bcps: 3
    delta: "ADDED"
    description: "Prompt engineering for single-line completions. Parse response into blink.cmp item(s). Configurable via model_config.completion.max_lines = 1."
    status: "pending"

  - story_id: "e02s06"
    title: "Multi-line block completion support (functions, control structures)"
    bcps: 5
    delta: "ADDED"
    description: "Prompt engineering for multi-line completions. Parse response preserving indentation. Configurable via model_config.completion.max_lines > 1."
    status: "pending"

  - story_id: "e02s07"
    title: "Completion granularity configuration (per-model / per-filetype)"
    bcps: 3
    delta: "ADDED"
    description: "Add completion config to model_config: max_lines, temperature, stop_sequences. Allow filetype overrides."
    status: "pending"

  - story_id: "e02s08"
    title: "Global on/off toggle (command + keymap)"
    bcps: 2
    delta: "ADDED"
    description: ":AICompletionToggle command and <leader>ac keymap to enable/disable blink.cmp source registration at runtime."
    status: "pending"

  - story_id: "e02s09"
    title: "Graceful degradation (server unavailable, errors, empty response)"
    bcps: 3
    delta: "ADDED"
    description: "Show error item in blink.cmp menu when server down / timeout / parse error. No UI blocking. Auto-retry on next trigger."
    status: "pending"

  - story_id: "e02s10"
    title: "Integration with existing model switching"
    bcps: 2
    delta: "ADDED"
    description: "Completion uses active model (state.current_model_key). Refresh context on model switch. No separate completion model needed."
    status: "pending"

# Total BCPs: 39
# Estimated duration: ~5-7 days (1 story ~0.5-1 day avg)

# Dependencies: none (standalone epic, builds on existing custom_ai foundation)
# Risks: blink.cmp API stability, LSP context gathering performance, llama.cpp completion endpoint compatibility
