# specs/product/SCOPE_LATEST.yaml
# Bounded PRD for inline-code-completion feature
# Source of truth for slice-tasks and plan-work

core_value: "Local AI code completions (Copilot-style) powered by your llama.cpp models, integrated into blink.cmp with automatic project context"

summary: |
  This initiative adds togglable inline code completion to custom_ai.nvim, the Neovim plugin for local llama.cpp integration.
  Users invoke completions manually via keybinding (e.g., <C-space> in insert mode), which queries the running llama.cpp server
  and presents completions in the blink.cmp completion menu alongside LSP suggestions. The plugin automatically gathers
  relevant project context (imports, type definitions, related functions, test files) via LSP and treesitter to improve
  completion quality. Completions can be single-line or multi-line, configurable per model or project. A global toggle
  enables/disables the feature. The existing model management, server lifecycle, and config system are reused.

  This is a single-epic initiative (e02-inline-completion) focused on the completion experience only — chat, multi-file
  edits, test generation, and documentation are explicitly out of scope.

in_scope:
  - "Epic e02: Inline Code Completion"
    - "Story: Manual trigger keybinding in insert mode (<C-space> by default, configurable)"
    - "Story: blink.cmp completion source registration and integration"
    - "Story: Automatic project context gathering via LSP (workspace symbols, references, definitions) and treesitter"
    - "Story: Completion request to llama.cpp with context injection (async, non-blocking)"
    - "Story: Single-line completion support (next logical line/token)"
    - "Story: Multi-line block completion support (functions, control structures)"
    - "Story: Completion granularity configuration (per-model or per-filetype)"
    - "Story: Global on/off toggle (command + keymap)"
    - "Story: Graceful degradation when llama.cpp server unavailable"
    - "Story: Integration with existing model switching (uses active model)"

out_of_scope:
  - "Chat window integration (separate feature — existing chat works independently)"
    - "Rationale: Different UX paradigm; chat is conversational, completion is inline"
  - "Multi-file edits / refactoring"
    - "Rationale: Requires different architecture (workspace edits, diffs); defer to future epic"
  - "Test generation"
    - "Rationale: Specialized use case; could be a separate completion mode later"
  - "Documentation generation"
    - "Rationale: Specialized use case; out of scope for inline completion MVP"
  - "Streaming token-by-token display"
    - "Rationale: Blocking request chosen for simplicity; streaming adds complexity (partial rendering, cancellation)"
    - "Deferred: Can be added as enhancement after blocking version works"
  - "Dedicated small/fast model for completion"
    - "Rationale: Uses active model; user manages model switching via existing <leader>am"
    - "Deferred: If latency proves problematic, can add dedicated completion_model config"
  - "Automatic ghost text as-you-type (Copilot-style passive suggestions)"
    - "Rationale: Manual trigger chosen for control and simplicity; passive suggestions require debouncing, filtering, UI polish"
    - "Deferred: Can be added as separate trigger mode after manual trigger works"
  - "Per-buffer or per-project toggle granularity"
    - "Rationale: Global toggle is MVP; finer granularity can be added if users request it"
  - "Virtual text / ghost text rendering (standalone)"
    - "Rationale: blink.cmp menu is primary UX; virtual text not needed for MVP"
  - "Completion caching / prefetching"
    - "Rationale: Optimization; not needed for initial delivery"
  - "Cross-file completion awareness (beyond context gathering)"
    - "Rationale: Context gathering covers imports/types; semantic cross-file completion is LSP territory"

constraints:
  - "Tech: Must integrate with blink.cmp as a completion source (not nvim-cmp, not standalone)"
  - "Tech: All network I/O async via vim.system() — zero UI blocking"
  - "Tech: Project context via Neovim LSP client (vim.lsp) and treesitter (vim.treesitter)"
  - "Tech: Reuse existing custom_ai config system (models, model_config, keymaps, server)"
  - "Tech: Reuse existing model management (switch_model, refresh_model, server lifecycle)"
  - "Tech: Respect global_keymaps setting for keymap scope"
  - "Tech: Lua 5.1/5.4, Neovim 0.10+"
  - "Runtime: llama.cpp server on localhost:9931 (configurable)"
  - "Runtime: Models defined in config (coder, specialist, allrounder, efficient, vision)"
  - "Performance: No hard latency target — 'usable' for local 7B-8B models"
  - "Compat: No breaking changes to existing chat, file ops, test runner features"

success_criteria:
  - "Press <C-space> in insert mode → blink.cmp menu opens with AI completions alongside LSP items"
  - "AI completions visibly include project context (imports, types, related functions from other files)"
  - "Single-line completions work (next line/token prediction)"
  - "Multi-line completions work (full function/block generation)"
  - "Completion granularity configurable via model_config or filetype"
  - "Global toggle command (:AICompletionToggle) and keymap enable/disable the blink.cmp source"
  - "Works with all configured models (coder, specialist, allrounder, efficient, vision)"
  - "No Neovim UI freeze during completion request (async vim.system)"
  - "Graceful error message in blink.cmp menu when server unavailable"
  - "Existing features (chat, ask_file, edit_code, run_tests) continue working unchanged"

references:
  - "specs/planning-context.yaml — elaborated decisions and constraints"
  - "lua/custom_ai/init.lua — existing plugin implementation (1347 lines)"
  - "blink.cmp documentation: https://github.com/Saghen/blink.cmp"
  - "Neovim LSP API: :h vim.lsp"
  - "Neovim treesitter API: :h vim.treesitter"

# Traceability: each in_scope story maps to a future epic capsule under specs/epics/e02-*/
# Out-of-scope items with "Deferred" rationale are candidates for future epics